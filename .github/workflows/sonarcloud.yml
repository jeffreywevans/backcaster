name: SonarCloud

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install package + dev dependencies
        run: |
          uv sync --locked --extra dev --no-install-project
          uv sync --locked --extra dev --no-build-isolation
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Generate reports for SonarCloud
        run: xvfb-run -a pytest --junitxml=pytest.xml --cov=src --cov-report=xml:coverage.xml

      - name: Validate Sonar token availability
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            if [ "$EVENT_NAME" = "pull_request" ] && { [ "$PR_HEAD_REPO_FORK" = "true" ] || [ "$ACTOR" = "dependabot[bot]" ]; }; then
              echo "Skipping SonarCloud scan for forked or Dependabot pull request because SONAR_TOKEN is unavailable."
              exit 0
            fi

            echo "SONAR_TOKEN is required for SonarCloud scanning on non-fork, non-Dependabot runs."
            exit 1
          fi

      - name: SonarQube Scan
        if: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]')) }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
