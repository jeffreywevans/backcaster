name: SonarCloud

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Generate reports for SonarCloud
        run: pytest --junitxml=pytest.xml --cov=src --cov-report=xml:coverage.xml

      - name: Validate Sonar token availability
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ] && { [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ] || [ "${{ github.actor }}" = "dependabot[bot]" ]; }; then
              echo "Skipping SonarCloud scan for forked or Dependabot pull request because SONAR_TOKEN is unavailable."
              exit 0
            fi

            echo "SONAR_TOKEN is required for SonarCloud scanning on non-fork, non-Dependabot runs."
            exit 1
          fi

      - name: SonarQube Scan
        if: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]')) }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
