name: Publish to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install locked build dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --extra dev --no-install-project
          uv sync --locked --extra dev --no-build-isolation
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import runpy

          version = runpy.run_path("src/backcaster/__init__.py")["__version__"]
          tag = os.environ["RELEASE_TAG"]
          if tag not in (version, f"v{version}"):
              raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}")
          PY

      - name: Build sdist and wheel
        run: uv build --no-build-isolation

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Smoke test installed wheel
        run: |
          uv venv /tmp/backcaster-wheel
          uv export --locked --no-dev --no-emit-project --output-file /tmp/backcaster-runtime.txt
          uv pip install --python /tmp/backcaster-wheel/bin/python --require-hashes -r /tmp/backcaster-runtime.txt
          uv pip install --python /tmp/backcaster-wheel/bin/python --no-deps dist/*.whl
          cd /tmp
          /tmp/backcaster-wheel/bin/python -c 'from backcaster import __version__; print(__version__)'
          /tmp/backcaster-wheel/bin/backcaster --help
          /tmp/backcaster-wheel/bin/backcaster hitters --help
          /tmp/backcaster-wheel/bin/backcaster pitchers --help

      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish distribution to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    environment:
      name: pypi
      url: https://pypi.org/p/backcaster
    permissions:
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
