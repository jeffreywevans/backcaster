sonar.projectKey=backcaster
sonar.projectName=backcaster
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

sonar.sourceEncoding=UTF-8

# Coverage and test execution reports generated during CI/local runs
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPaths=pytest.xml

# Exclude common non-source artifacts
sonar.exclusions=**/__pycache__/**,**/*.pyc
