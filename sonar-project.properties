# Required SonarCloud identifiers
sonar.projectKey=jeffreywevans_backcaster
sonar.organization=jeffreywevans

# Optional metadata shown in SonarCloud UI
sonar.projectName=backcaster

# Keep scan scope explicit and deterministic
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.sourceEncoding=UTF-8

# Reduce analysis noise from generated/runtime paths
sonar.exclusions=.venv/**,.scannerwork/**
