# Required SonarCloud identifiers
sonar.projectKey=jeffreywevans_backcaster
sonar.organization=jeffreywevans

# Optional metadata shown in SonarCloud UI
sonar.projectName=backcaster

# Keep scan scope explicit and deterministic
sonar.sources=.
sonar.inclusions=src/**/*.py
sonar.sourceEncoding=UTF-8

# Test and coverage configuration
sonar.tests=.
sonar.test.inclusions=tests/**/*.py
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPaths=pytest.xml

# Exclude common non-source artifacts
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/.pytest_cache/**,.venv/**,.scannerwork/**
